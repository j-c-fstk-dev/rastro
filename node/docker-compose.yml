# Rastro community node: a Nostr relay, a Blossom photo server and a Tor onion address.
# Start it with ./start.sh

services:
  relay:
    # strfry, built from the upstream release so no third-party image is trusted.
    build: https://github.com/hoytech/strfry.git#1.1.3
    image: rastro-node/strfry:1.1.3
    restart: unless-stopped
    volumes:
      - ./strfry.conf:/app/strfry.conf:ro
      - relay-db:/app/strfry-db
    ports:
      - "${RELAY_PORT:-7777}:7777"
    networks:
      node:
        ipv4_address: 172.30.70.10

  photos:
    image: ghcr.io/hzrd149/blossom-server:master
    restart: unless-stopped
    environment:
      BLOSSOM_REQUIRE_CONFIG: "1"
    volumes:
      - ./blossom.yml:/app/config.yml:ro
      - photos-data:/app/data
    ports:
      - "${PHOTOS_PORT:-3000}:3000"
    networks:
      node:
        ipv4_address: 172.30.70.11

  tor:
    build: ./tor
    image: rastro-node/tor
    restart: unless-stopped
    volumes:
      - tor-data:/var/lib/tor
    depends_on: [relay, photos]
    networks:
      node:
        ipv4_address: 172.30.70.12

  # Optional public HTTPS address through a Cloudflare Tunnel: ./start.sh --tunnel
  # Phones load the app over HTTPS, so they can only reach a node over https/wss.
  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: [tunnel]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    networks: [node]

volumes:
  relay-db:
  photos-data:
  tor-data:

networks:
  node:
    ipam:
      config:
        - subnet: 172.30.70.0/24
